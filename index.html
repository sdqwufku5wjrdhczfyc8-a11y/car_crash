<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra-Realistic 3D Supercar Crash Sandbox</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #07090e;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .touch-btn:active {
      transform: scale(0.92);
      filter: brightness(1.25);
    }
    .hazard-stripe {
      background: repeating-linear-gradient(
        -45deg,
        #facc15,
        #facc15 10px,
        #000000 10px,
        #000000 20px
      );
    }
  </style>
</head>
<body class="bg-gray-950 text-white">
  <div id="canvas-container"></div>

  <!-- HUD Overlay -->
  <div class="hud-layer flex flex-col justify-between p-3 sm:p-6">
    <!-- Top Bar -->
    <div class="flex items-center justify-between gap-2 sm:gap-4">
      <!-- Speedometer & RPM gauge -->
      <div class="flex items-center gap-3 bg-black/75 backdrop-blur-md px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-2xl border border-yellow-500/40 shadow-2xl">
        <div class="w-2.5 h-9 hazard-stripe rounded-sm"></div>
        <div>
          <div class="text-[9px] sm:text-[10px] tracking-widest text-yellow-400 font-extrabold uppercase">PRO SUPERCAR TEST</div>
          <div class="text-xl sm:text-3xl font-black italic tracking-wider flex items-baseline gap-1">
            <span id="speed-meter" class="text-white font-mono drop-shadow-[0_0_12px_rgba(255,255,255,0.4)]">0</span>
            <span class="text-[10px] sm:text-xs text-yellow-400 font-bold">KM/H</span>
          </div>
        </div>
      </div>

      <!-- Parts Integrity & Camera / Repair Button -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 残存パーツメーター -->
        <div class="bg-black/75 backdrop-blur-md px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl border border-white/15 flex flex-col items-end shadow-lg">
          <div class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">BODY STATUS</div>
          <div id="parts-counter" class="text-xs sm:text-base font-extrabold text-emerald-400 font-mono tracking-tight">16 / 16</div>
        </div>

        <!-- 視点切替ボタン -->
        <button id="btn-camera" class="touch-btn bg-slate-900/80 hover:bg-slate-800 text-white px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl border border-white/20 shadow-lg flex items-center gap-2 transition-all">
          <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <span id="camera-label" class="text-xs font-bold hidden sm:inline">後方45°視点 [C]</span>
        </button>

        <!-- 修理リセットボタン -->
        <button id="btn-repair" class="touch-btn bg-gradient-to-r from-yellow-500 via-amber-400 to-yellow-300 text-black font-black px-4 py-2 sm:px-5 sm:py-2.5 rounded-2xl shadow-xl shadow-yellow-500/30 border border-yellow-200 flex items-center gap-1.5 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span class="text-xs tracking-wider font-extrabold">REPAIR [R]</span>
        </button>
      </div>
    </div>

    <!-- Center Crash Warning Alert -->
    <div id="crash-alert" class="self-center opacity-0 transition-opacity duration-150 pointer-events-none text-center">
      <div class="bg-red-600/90 text-white font-black text-2xl sm:text-4xl px-7 py-2 rounded-2xl italic tracking-widest shadow-[0_0_30px_rgba(239,68,68,0.8)] border-2 border-yellow-400 transform -rotate-2">
        CRASH!
      </div>
    </div>

    <!-- Bottom Controls (Mobile Touch + PC Guide) -->
    <div class="flex justify-between items-end gap-3 pb-2 sm:pb-4 pointer-events-none">
      <!-- Steering (Left / Right) -->
      <div class="flex items-center gap-2 sm:gap-4 pointer-events-auto">
        <button id="btn-left" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 bg-slate-900/85 active:bg-yellow-500/90 rounded-3xl border-2 border-slate-700 active:border-yellow-300 flex items-center justify-center shadow-2xl backdrop-blur-md">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <button id="btn-right" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 bg-slate-900/85 active:bg-yellow-500/90 rounded-3xl border-2 border-slate-700 active:border-yellow-300 flex items-center justify-center shadow-2xl backdrop-blur-md">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>

      <!-- Drive & Reverse Pedals -->
      <div class="flex items-center gap-2 sm:gap-4 pointer-events-auto">
        <button id="btn-brake" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 bg-slate-900/85 active:bg-rose-600/90 rounded-3xl border-2 border-slate-700 active:border-rose-400 flex flex-col items-center justify-center shadow-2xl backdrop-blur-md">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path>
          </svg>
          <span class="text-[9px] font-black text-rose-300">BRAKE</span>
        </button>
        <button id="btn-accel" class="touch-btn w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-emerald-600 to-teal-500 active:from-emerald-400 active:to-teal-300 rounded-3xl border-2 border-emerald-300 flex flex-col items-center justify-center shadow-2xl shadow-emerald-500/40 backdrop-blur-md">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path>
          </svg>
          <span class="text-[11px] font-black tracking-widest text-white">GAS!</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ========================================================
       1. ADVANCED WEB AUDIO API SYNTHESIZER
          (リアルなエンジン回転数、タイヤスキール、重層クラッシュ音)
       ======================================================== */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 重層的な破壊・クラッシュ衝突音合成
    function playCrashSound(intensity = 1.0) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(Math.max(intensity, 0.4), 1.6);

      // A. 低域インパクト（爆発的衝撃）
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(160 * vol, now);
      subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
      subGain.gain.setValueAtTime(1.4 * vol, now);
      subGain.gain.exponentialRampToValueAtTime(0.005, now + 0.4);
      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.42);

      // B. 金属破砕ノイズ（ボディのひしゃげ音）
      const bufferSize = audioCtx.sampleRate * 0.45;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.15));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(950 * vol, now);
      noiseFilter.Q.setValueAtTime(3.0, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.4);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(1.2 * vol, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(now);

      // C. ガラス・パーツ散乱の甲高い破片音
      const glassOsc = audioCtx.createOscillator();
      const glassGain = audioCtx.createGain();
      glassOsc.type = 'sawtooth';
      glassOsc.frequency.setValueAtTime(1200 * vol, now);
      glassOsc.frequency.linearRampToValueAtTime(350, now + 0.25);
      glassGain.gain.setValueAtTime(0.35 * vol, now);
      glassGain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
      glassOsc.connect(glassGain);
      glassGain.connect(audioCtx.destination);
      glassOsc.start(now);
      glassOsc.stop(now + 0.28);
    }

    // エンジン音（アイドリング＆回転数に応じたピッチシフト）
    let engineOsc1 = null;
    let engineOsc2 = null;
    let engineFilter = null;
    let engineGain = null;

    function startEngineSound() {
      if (!audioCtx || engineOsc1) return;
      const now = audioCtx.currentTime;

      engineOsc1 = audioCtx.createOscillator();
      engineOsc2 = audioCtx.createOscillator();
      engineGain = audioCtx.createGain();
      engineFilter = audioCtx.createBiquadFilter();

      engineOsc1.type = 'sawtooth';
      engineOsc2.type = 'triangle';

      engineFilter.type = 'lowpass';
      engineFilter.frequency.setValueAtTime(250, now);

      engineOsc1.frequency.setValueAtTime(40, now);
      engineOsc2.frequency.setValueAtTime(80, now);

      engineGain.gain.setValueAtTime(0.06, now);

      engineOsc1.connect(engineFilter);
      engineOsc2.connect(engineFilter);
      engineFilter.connect(engineGain);
      engineGain.connect(audioCtx.destination);

      engineOsc1.start();
      engineOsc2.start();
    }

    function updateEngineSound(speedRatio, isAccel) {
      if (!engineOsc1 || !audioCtx) return;
      const now = audioCtx.currentTime;
      const baseFreq = 45 + speedRatio * 180 + (isAccel ? 25 : 0);

      engineOsc1.frequency.setTargetAtTime(baseFreq, now, 0.05);
      engineOsc2.frequency.setTargetAtTime(baseFreq * 2.0, now, 0.05);
      engineFilter.frequency.setTargetAtTime(200 + speedRatio * 900 + (isAccel ? 300 : 0), now, 0.06);

      const vol = 0.05 + speedRatio * 0.09 + (isAccel ? 0.04 : 0);
      engineGain.gain.setTargetAtTime(vol, now, 0.05);
    }

    // タイヤスキール音（急旋回や急ブレーキ時）
    let screechOsc = null;
    let screechGain = null;
    function triggerTireScreech(active) {
      if (!audioCtx) return;
      if (active) {
        if (!screechOsc) {
          screechOsc = audioCtx.createOscillator();
          screechGain = audioCtx.createGain();
          screechOsc.type = 'sawtooth';
          screechOsc.frequency.setValueAtTime(850, audioCtx.currentTime);
          screechGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
          screechOsc.connect(screechGain);
          screechGain.connect(audioCtx.destination);
          screechOsc.start();
        }
        screechGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.05);
      } else if (screechGain) {
        screechGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
      }
    }

    /* ========================================================
       2. THREE.JS 3D SCENE SETUP & PROCEDURAL ENVIRONMENT MAP
       ======================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c111d);
    scene.fog = new THREE.FogExp2(0x0c111d, 0.0075);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // 擬似キューブマップ（リアルな反射表現用）
    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(128, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
      magFilter: THREE.LinearFilter
    });
    const cubeCamera = new THREE.CubeCamera(0.5, 200, cubeRenderTarget);
    scene.add(cubeCamera);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.6);
    sunLight.position.set(45, 90, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 300;
    sunLight.shadow.camera.left = -90;
    sunLight.shadow.camera.right = 90;
    sunLight.shadow.camera.top = 90;
    sunLight.shadow.camera.bottom = -90;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    const fillLight = new THREE.HemisphereLight(0x38bdf8, 0x1e293b, 0.75);
    scene.add(fillLight);

    /* ========================================================
       3. ARENA ENVIRONMENT (Crash Walls, Pillars, Crates, Barrels)
       ======================================================== */
    // アスファルト地面
    const groundGeo = new THREE.PlaneGeometry(350, 350);
    const gCanvas = document.createElement('canvas');
    gCanvas.width = 512;
    gCanvas.height = 512;
    const gCtx = gCanvas.getContext('2d');
    gCtx.fillStyle = '#141823';
    gCtx.fillRect(0, 0, 512, 512);
    // グリッド線
    gCtx.strokeStyle = '#232b3b';
    gCtx.lineWidth = 4;
    gCtx.strokeRect(0, 0, 512, 512);
    // クラッシュテスト標的マーク
    gCtx.fillStyle = '#facc15';
    gCtx.beginPath();
    gCtx.arc(256, 256, 16, 0, Math.PI * 2);
    gCtx.fill();
    gCtx.fillStyle = '#000000';
    gCtx.beginPath();
    gCtx.arc(256, 256, 8, 0, Math.PI * 2);
    gCtx.fill();

    const groundTex = new THREE.CanvasTexture(gCanvas);
    groundTex.wrapS = THREE.RepeatWrapping;
    groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(35, 35);

    const groundMat = new THREE.MeshStandardMaterial({
      map: groundTex,
      roughness: 0.88,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const arenaSize = 150;
    const wallHeight = 4.8;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.75 });
    const hazardMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 });

    function createArenaBorder() {
      const borders = [
        { x: 0, z: -arenaSize / 2, w: arenaSize, h: wallHeight, d: 2.5 },
        { x: 0, z: arenaSize / 2, w: arenaSize, h: wallHeight, d: 2.5 },
        { x: -arenaSize / 2, z: 0, w: 2.5, h: wallHeight, d: arenaSize },
        { x: arenaSize / 2, z: 0, w: 2.5, h: wallHeight, d: arenaSize }
      ];
      borders.forEach(b => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), wallMat);
        wall.position.set(b.x, b.h / 2, b.z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
        // 上部警戒ストライプ
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.1, 0.7, b.d + 0.1), hazardMat);
        stripe.position.set(b.x, b.h - 0.35, b.z);
        scene.add(stripe);
      });
    }
    createArenaBorder();

    // 障害物コレクション
    const staticObstacles = [];
    const dynamicProps = [];

    // コンクリート衝突柱
    function addConcretePillar(x, z, r = 2.4, h = 9) {
      const geo = new THREE.CylinderGeometry(r, r, h, 28);
      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const band = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.08, r + 0.08, 1.4, 28), hazardMat);
      band.position.set(x, 1.3, z);
      scene.add(band);

      staticObstacles.push({ type: 'pillar', x, z, radius: r });
    }
    addConcretePillar(-26, -22, 2.8);
    addConcretePillar(26, -22, 2.8);
    addConcretePillar(-32, 28, 2.5);
    addConcretePillar(32, 28, 2.5);
    addConcretePillar(0, 38, 3.2);

    // ジャンプ台
    function addRamp(x, z, rotY) {
      const group = new THREE.Group();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(9, 0.45, 14), new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.4, roughness: 0.3 }));
      mesh.position.set(0, 2.0, 0);
      mesh.rotation.x = 0.28;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);
      staticObstacles.push({ type: 'ramp', x, z, radius: 5.0 });
    }
    addRamp(0, -12, 0);
    addRamp(-38, 2, Math.PI / 3);
    addRamp(38, 2, -Math.PI / 3);

    // 吹き飛ぶ木箱 (Wooden Crates)
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.85 });
    function addCrate(x, y, z) {
      const size = 1.4;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), boxMat);
      mesh.position.set(x, y + size / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      dynamicProps.push({
        mesh,
        initialPos: new THREE.Vector3(x, y + size / 2, z),
        vx: 0, vy: 0, vz: 0,
        rx: 0, ry: 0, rz: 0,
        radius: 0.95,
        isHit: false
      });
    }
    function createCratePyramid(startX, startZ) {
      for (let y = 0; y < 3; y++) {
        for (let x = -1.2 + y * 0.6; x <= 1.2 - y * 0.6; x += 1.4) {
          addCrate(startX + x, y * 1.4, startZ);
        }
      }
    }
    createCratePyramid(-14, 12);
    createCratePyramid(14, 12);
    createCratePyramid(0, -36);

    // 吹き飛ぶドラム缶 (Oil Barrels)
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, metalness: 0.6, roughness: 0.35 });
    function addBarrel(x, z) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 1.9, 18), barrelMat);
      mesh.position.set(x, 0.95, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      dynamicProps.push({
        mesh,
        initialPos: new THREE.Vector3(x, 0.95, z),
        vx: 0, vy: 0, vz: 0,
        rx: 0, ry: 0, rz: 0,
        radius: 0.85,
        isHit: false
      });
    }
    for (let i = -3; i <= 3; i++) {
      addBarrel(i * 1.9, 22);
      addBarrel(-22, -12 + i * 1.7);
      addBarrel(22, -12 + i * 1.7);
    }

    /* ========================================================
       4. EXTREMELY DETAILED PROCEDURAL SUPERCAR MODEL
          (高級メタリック塗装・詳細な内装・ブレーキ機構・四散パーツ)
       ======================================================== */
    const carRoot = new THREE.Group();
    scene.add(carRoot);

    // 高級マテリアル群
    const paintMat = new THREE.MeshPhysicalMaterial({
      color: 0xdc2626, // Crimson Red
      metalness: 0.85,
      roughness: 0.18,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08,
      envMap: cubeRenderTarget.texture
    });

    const carbonMat = new THREE.MeshStandardMaterial({
      color: 0x18181b,
      metalness: 0.7,
      roughness: 0.35
    });

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x0f172a,
      metalness: 0.9,
      roughness: 0.05,
      transparent: true,
      opacity: 0.82,
      envMap: cubeRenderTarget.texture
    });

    const darkInteriorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.75 });
    const seatLeatherMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.5 }); // Dark Red Leather
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.95, roughness: 0.1 });

    /* ========================================================
       5. IMPACT PARTICLES (Sparks, Smoke puffs, Radiator debris)
       ======================================================== */
    const maxParticles = 160;
    const pGeo = new THREE.BufferGeometry();
    const pPositions = new Float32Array(maxParticles * 3);
    const pVelocities = [];
    for (let i = 0; i < maxParticles; i++) {
      pPositions[i * 3] = 0;
      pPositions[i * 3 + 1] = -100;
      pPositions[i * 3 + 2] = 0;
      pVelocities.push(new THREE.Vector3());
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0xfacc15,
      size: 0.45,
      transparent: true,
      opacity: 0.95
    });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    function triggerCrashParticles(originPos, count = 50) {
      const positions = pGeo.attributes.position.array;
      let spawned = 0;
      for (let i = 0; i < maxParticles && spawned < count; i++) {
        if (pVelocities[i].y === 0) {
          positions[i * 3] = originPos.x;
          positions[i * 3 + 1] = originPos.y + 0.3;
          positions[i * 3 + 2] = originPos.z;
          pVelocities[i].set(
            (Math.random() - 0.5) * 18,
            Math.random() * 14 + 5,
            (Math.random() - 0.5) * 18
          );
          spawned++;
        }
      }
      pGeo.attributes.position.needsUpdate = true;
    }

    function updateParticles(dt) {
      const positions = pGeo.attributes.position.array;
      for (let i = 0; i < maxParticles; i++) {
        if (pVelocities[i].lengthSq() > 0.01) {
          positions[i * 3] += pVelocities[i].x * dt;
          positions[i * 3 + 1] += pVelocities[i].y * dt;
          positions[i * 3 + 2] += pVelocities[i].z * dt;

          pVelocities[i].y -= 26 * dt;
          pVelocities[i].multiplyScalar(0.96);

          if (positions[i * 3 + 1] <= 0.1) {
            positions[i * 3 + 1] = 0.1;
            pVelocities[i].y *= -0.32;
            if (Math.abs(pVelocities[i].y) < 1.0) {
              pVelocities[i].set(0, 0, 0);
              positions[i * 3 + 1] = -100;
            }
          }
        }
      }
      pGeo.attributes.position.needsUpdate = true;
    }

    /* ========================================================

    const car = {

      maxSpeed: 54, // 最高速度 ~190km/h相当

    };

    // キーボード入力
    window.addEventListener('keydown', (e) => {
      initAudio();
      startEngineSound();
      if (['ArrowUp', 'KeyW'].includes(e.code)) inputs.forward = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) inputs.backward = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) inputs.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) inputs.right = true;

      if (['ArrowUp', 'KeyW'].includes(e.code)) inputs.forward = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) inputs.backward = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) inputs.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) inputs.right = false;
      if (e.code === 'Space') inputs.backward = false;
    });

    // タッチボタン
    function setupTouch(elemId, key) {
      const btn = document.getElementById(elemId);
      const onStart = (e) => {
        e.preventDefault();
        initAudio();
        startEngineSound();
        inputs[key] = true;
      };
      const onEnd = (e) => {
        e.preventDefault();
        inputs[key] = false;
      };
      btn.addEventListener('touchstart', onStart, { passive: false });
      btn.addEventListener('touchend', onEnd, { passive: false });
      btn.addEventListener('mousedown', onStart);
      btn.addEventListener('mouseup', onEnd);
      btn.addEventListener('mouseleave', onEnd);

    setupTouch('btn-brake', 'backward');
    setupTouch('btn-left', 'left');

    /* ========================================================
       7. DYNAMIC DESTRUCTION & CRASH PHYSICS
       ======================================================== */
    let intactPartsCount = carParts.length;
    const partsCounterElem = document.getElementById('parts-counter');
    const crashAlertElem = document.getElementById('crash-alert');
    let crashTimer = null;

    function showCrashAlert() {
      crashAlertElem.style.opacity = '1';
      clearTimeout(crashTimer);
      crashTimer = setTimeout(() => {
        crashAlertElem.style.opacity = '0';
      }, 550);
    }

    function detachPart(part, impactDir, force) {
      if (part.detached) return;
      part.detached = true;

      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      part.mesh.getWorldPosition(worldPos);
      part.mesh.getWorldQuaternion(worldQuat);

      carRoot.remove(part.mesh);
      scene.add(part.mesh);
      part.mesh.position.copy(worldPos);
      part.mesh.quaternion.copy(worldQuat);

      const spreadX = (Math.random() - 0.5) * 10;
      const spreadZ = (Math.random() - 0.5) * 10;
      const upward = Math.random() * 9 + 5 + (force * 0.22);

      part.vx = -impactDir.x * (force * 0.42) + spreadX;
      part.vy = upward;
      part.vz = -impactDir.z * (force * 0.42) + spreadZ;

      part.rx = (Math.random() - 0.5) * 14;
      part.ry = (Math.random() - 0.5) * 14;
      part.rz = (Math.random() - 0.5) * 14;

      intactPartsCount--;
      updatePartsUI();
    }

    function updatePartsUI() {
      partsCounterElem.textContent = `${intactPartsCount} / ${carParts.length}`;
      if (intactPartsCount <= 5) {
        partsCounterElem.className = 'text-xs sm:text-base font-extrabold text-rose-500 font-mono tracking-tight animate-pulse';
      } else if (intactPartsCount <= 11) {
        partsCounterElem.className = 'text-xs sm:text-base font-extrabold text-yellow-400 font-mono tracking-tight';
      } else {
        partsCounterElem.className = 'text-xs sm:text-base font-extrabold text-emerald-400 font-mono tracking-tight';
      }
    }

    function repairVehicle() {
      initAudio();
      carParts.forEach(p => {
        if (p.detached) {
          scene.remove(p.mesh);
          carRoot.add(p.mesh);
          p.detached = false;
        }
        p.mesh.position.copy(p.initialPos);
        p.mesh.rotation.copy(p.initialRot);
        p.vx = p.vy = p.vz = 0;
        p.rx = p.ry = p.rz = 0;
      });

      dynamicProps.forEach(dp => {
        dp.mesh.position.copy(dp.initialPos);
        dp.mesh.rotation.set(0, 0, 0);
        dp.vx = dp.vy = dp.vz = 0;
        dp.rx = dp.ry = dp.rz = 0;
        dp.isHit = false;
      });

      car.x = 0;
      car.y = 0;
      car.z = 0;
      car.angle = 0;
      car.speed = 0;

      intactPartsCount = carParts.length;
      updatePartsUI();

      if (audioCtx) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.2); // C6
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }
    }
    document.getElementById('btn-repair').addEventListener('click', repairVehicle);

    function performCrash(collisionNormal, impactSpeed) {
      if (impactSpeed < 5) return;

      playCrashSound(impactSpeed / 20);
      showCrashAlert();

      const carPos = new THREE.Vector3(car.x, 0.5, car.z);
      triggerCrashParticles(carPos, Math.min(Math.floor(impactSpeed * 2.2), 60));

      // 衝撃力に応じた段階的剥離
      const detachChance = Math.min((impactSpeed - 4) / 22, 1.0);
      carParts.forEach(part => {
        if (!part.detached && Math.random() < detachChance) {
          detachPart(part, collisionNormal, impactSpeed);
        }
      });

      // 反発とリバウンド
      car.speed = -car.speed * 0.42;
      car.x += collisionNormal.x * 0.7;
      car.z += collisionNormal.z * 0.7;
    }

    /* ========================================================
       8. MULTI-CAMERA SYSTEM (45° Chase Cam & Cockpit View)
       ======================================================== */
    let isCockpitView = false;
    const btnCamera = document.getElementById('btn-camera');
    const cameraLabel = document.getElementById('camera-label');

    function toggleCamera() {
      initAudio();
      isCockpitView = !isCockpitView;
      cameraLabel.textContent = isCockpitView ? '運転席視点 [C]' : '後方45°視点 [C]';
    }
    btnCamera.addEventListener('click', toggleCamera);

    const speedMeterElem = document.getElementById('speed-meter');

    /* ========================================================
       9. SIMULATION & RENDER LOOP
       ======================================================== */
    let lastTime = performance.now();

    function updateSimulation(dt) {
      // 1. 車両加減速
      if (inputs.forward) {
        car.speed = Math.min(car.speed + car.accel * dt, car.maxSpeed);
      } else if (inputs.backward) {
        car.speed = Math.max(car.speed - car.brakeDecel * dt, -car.maxSpeed * 0.45);
      } else {
        if (car.speed > 0) car.speed = Math.max(car.speed - car.friction * dt, 0);
        else if (car.speed < 0) car.speed = Math.min(car.speed + car.friction * dt, 0);
      }

      // 2. ステアリング
      const isTurning = inputs.left || inputs.right;
      if (Math.abs(car.speed) > 0.5) {
        const steerDir = (car.speed >= 0 ? 1 : -1);
        if (inputs.left) car.angle += car.maxSteer * steerDir;
        if (inputs.right) car.angle -= car.maxSteer * steerDir;
      }

      // タイヤスキール音判定（急激な旋回または急ブレーキ時）
      const shouldScreech = (isTurning && Math.abs(car.speed) > 28) || (inputs.backward && car.speed > 25);
      triggerTireScreech(shouldScreech);

      // 前輪ステア角度
      const wheelAngle = inputs.left ? 0.42 : (inputs.right ? -0.42 : 0);
      if (!wheelFL.detached) wheelFL.mesh.rotation.y = wheelAngle;
      if (!wheelFR.detached) wheelFR.mesh.rotation.y = wheelAngle;

      // 座標更新
      const forwardX = Math.sin(car.angle);
      const forwardZ = Math.cos(car.angle);
      car.x += forwardX * car.speed * dt;
      car.z += forwardZ * car.speed * dt;

      // 3. アリーナ外壁との衝突
      const limit = arenaSize / 2 - 2.8;
      if (Math.abs(car.x) > limit) {
        const normal = new THREE.Vector3(car.x > 0 ? -1 : 1, 0, 0);
        performCrash(normal, Math.abs(car.speed));
        car.x = Math.sign(car.x) * limit;
      }
      if (Math.abs(car.z) > limit) {
        const normal = new THREE.Vector3(0, 0, car.z > 0 ? -1 : 1);
        performCrash(normal, Math.abs(car.speed));
        car.z = Math.sign(car.z) * limit;
      }

      // 4. 固定柱・ジャンプ台との衝突
      staticObstacles.forEach(obs => {
        if (obs.type === 'pillar') {
          const dx = car.x - obs.x;
          const dz = car.z - obs.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          const minDist = obs.radius + 1.85;
          if (dist < minDist) {
            const normal = new THREE.Vector3(dx / dist, 0, dz / dist);
            performCrash(normal, Math.abs(car.speed));
            car.x = obs.x + normal.x * minDist;
            car.z = obs.z + normal.z * minDist;
          }
        } else if (obs.type === 'ramp') {
          const dx = car.x - obs.x;
          const dz = car.z - obs.z;
          if (Math.sqrt(dx * dx + dz * dz) < obs.radius && Math.abs(car.speed) > 12) {
            car.y = Math.min(car.y + 0.45, 2.8);
          }
        }
      });

      // 着地重力
      if (car.y > 0) {
        car.y = Math.max(car.y - 10 * dt, 0);
      }

      // 5. 吹き飛ぶ木箱・ドラム缶との衝突
      dynamicProps.forEach(prop => {
        const dx = prop.mesh.position.x - car.x;
        const dz = prop.mesh.position.z - car.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < prop.radius + 1.65 && Math.abs(car.speed) > 3) {
          prop.isHit = true;
          const impact = Math.abs(car.speed);
          playCrashSound(impact * 0.05);

          const dirX = dx / (dist || 1);
          const dirZ = dz / (dist || 1);
          prop.vx = dirX * impact * 0.85 + (Math.random() - 0.5) * 6;
          prop.vy = Math.random() * 9 + 4;
          prop.vz = dirZ * impact * 0.85 + (Math.random() - 0.5) * 6;
          prop.rx = (Math.random() - 0.5) * 12;
          prop.ry = (Math.random() - 0.5) * 12;
          prop.rz = (Math.random() - 0.5) * 12;

          car.speed *= 0.86;
          if (impact > 18 && Math.random() < 0.45) {
            const intactList = carParts.filter(p => !p.detached);
            if (intactList.length > 0) {
              const p = intactList[Math.floor(Math.random() * intactList.length)];
              detachPart(p, new THREE.Vector3(-dirX, 0, -dirZ), impact * 0.65);
            }
          }
        }
      });

      // 6. 分離パーツの物理挙動更新
      carParts.forEach(part => {
        if (part.detached) {
          part.mesh.position.x += part.vx * dt;
          part.mesh.position.y += part.vy * dt;
          part.mesh.position.z += part.vz * dt;

          part.mesh.rotation.x += part.rx * dt;
          part.mesh.rotation.y += part.ry * dt;
          part.mesh.rotation.z += part.rz * dt;

          part.vy -= 24 * dt;
          part.vx *= 0.985;
          part.vz *= 0.985;

          if (part.mesh.position.y <= 0.28) {
            part.mesh.position.y = 0.28;
            part.vy = -part.vy * 0.38;
            part.rx *= 0.7;
            part.rz *= 0.7;
            if (Math.abs(part.vy) < 0.5) {
              part.vy = 0;
              part.vx *= 0.88;
              part.vz *= 0.88;
            }
          }
        }
      });

      // 7. ドラム缶・木箱の物理挙動更新
      dynamicProps.forEach(prop => {
        if (prop.isHit) {
          prop.mesh.position.x += prop.vx * dt;
          prop.mesh.position.y += prop.vy * dt;
          prop.mesh.position.z += prop.vz * dt;

          prop.mesh.rotation.x += prop.rx * dt;
          prop.mesh.rotation.y += prop.ry * dt;
          prop.mesh.rotation.z += prop.rz * dt;

          prop.vy -= 25 * dt;
          if (prop.mesh.position.y <= 0.65) {
            prop.mesh.position.y = 0.65;
            prop.vy = -prop.vy * 0.35;
            prop.vx *= 0.82;
            prop.vz *= 0.82;
          }
        }
      });

      // パーティクル更新
      updateParticles(dt);

      // 車両モデル位置の更新
      carRoot.position.set(car.x, car.y, car.z);
      carRoot.rotation.y = car.angle;

      // HUD & サウンド
      const speedKmH = Math.round(Math.abs(car.speed) * 3.6);
      speedMeterElem.textContent = speedKmH;
      updateEngineSound(Math.abs(car.speed) / car.maxSpeed, inputs.forward);

      // 8. カメラの追従
      if (isCockpitView) {
        // リアルな運転席視点（ドライバーの目線：ステアリングとボンネット越しに前方を捉える）
        const forward = new THREE.Vector3(Math.sin(car.angle), 0, Math.cos(car.angle));
        const right = new THREE.Vector3(Math.cos(car.angle), 0, -Math.sin(car.angle));
        camera.position.set(
          car.x - right.x * 0.42 + forward.x * 0.15,
          car.y + 0.98,
          car.z - right.z * 0.42 + forward.z * 0.15
        );
        const lookTarget = new THREE.Vector3(
          car.x - right.x * 0.42 + forward.x * 25,
          car.y + 0.85,
          car.z - right.z * 0.42 + forward.z * 25
        );
        camera.lookAt(lookTarget);
      } else {
        // 後方45度からのダイナミック追従視点
        const camDistance = 8.8;
        const camHeight = 4.3;
        const targetCamX = car.x - Math.sin(car.angle) * camDistance;
        const targetCamZ = car.z - Math.cos(car.angle) * camDistance;

        camera.position.x += (targetCamX - camera.position.x) * 0.14;
        camera.position.y += (car.y + camHeight - camera.position.y) * 0.14;
        camera.position.z += (targetCamZ - camera.position.z) * 0.14;
        camera.lookAt(car.x, car.y + 0.9, car.z);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      updateSimulation(dt);
      renderer.render(scene, camera);
    }

    // リサイズ処理
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
